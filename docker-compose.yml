version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./screening_history:/app/screening_history

  frontend:
    build:
      context: ./tiny-tots-assess-main
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
